name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build (release)
        run: ./build.sh

      - name: Sanity check binary
        run: file bin/focusfx && test -x bin/focusfx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusfx
          path: bin/focusfx
          if-no-files-found: error
