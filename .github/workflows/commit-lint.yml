name: Commit Lint

on:
  pull_request:

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages (gitmoji + Conventional Commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          tmp="$(mktemp)"
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$sha" > "$tmp"
            if ! scripts/hooks/commit-msg "$tmp"; then
              echo "::error::Bad commit message: $sha"
              git log -1 --format='  %h %s' "$sha"
              fail=1
            fi
          done
          exit $fail
